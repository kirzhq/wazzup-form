spring.application.name=wazzup-backend

spring.datasource.url=${DB_URL:jdbc:sqlite:wazzup.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

wazzup.partner.client-id=${WAZZUP_PARTNER_CLIENT_ID:}
wazzup.partner.email=${WAZZUP_PARTNER_EMAIL:}
wazzup.partner.password=${WAZZUP_PARTNER_PASSWORD:}
wazzup.partner.redirect-uri=${WAZZUP_OAUTH_REDIRECT_URI:http://127.0.0.1:8080/api/partner/oauth/callback}
wazzup.partner.encryption-key=${WAZZUP_TOKEN_ENCRYPTION_KEY:}
wazzup.partner.webhook-url=${WAZZUP_WEBHOOK_URL:}
wazzup.partner.sync-enabled=${WAZZUP_SYNC_ENABLED:false}
