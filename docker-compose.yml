name: wazzup-contacts

services:
  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:sqlite:/data/wazzup.db
      SERVER_PORT: 8080
    volumes:
      - wazzup_sqlite_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wazzup_sqlite_data:
